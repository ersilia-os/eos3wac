Identifier: eos3wac
Slug: moldeberta-smiles-encoder
Status: Ready
Title: Chemistry-Informed Molecular Encoder
Description: Returns a 768-dimensional embedding from MolDeBERTa, a DeBERTaV2 encoder
  pretrained on 123 million PubChem SMILES with byte-level tokenisation that avoids
  merging chemically unrelated characters. Beyond masked-token prediction, de Oliveira
  and Saeed added objectives regressing and classifying molecular descriptors and
  contrasting similar structures, so physicochemical and substructure information
  is encoded rather than implicit. Fine-tuned versions beat earlier SMILES encoders
  on seven of nine MoleculeNet benchmarks. Features come from the classification token
  and are not read one by one.
