Identifier: eos3wac
Slug: moldeberta-smiles-encoder
Status: Ready
Title: Chemistry-Informed Molecular Encoder
Description: Returns a 768-dimensional embedding from MolDeBERTa, pretrained on 123 million PubChem molecules with a DeBERTaV2 backbone. Beyond masked-token prediction, training included chemistry-informed objectives so that physicochemical properties and substructure information are encoded rather than left implicit in the string. The embedding is drawn from the classification token and is task-independent, intended as input to downstream models rather than read directly.
