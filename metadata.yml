Identifier: eos3wac
Slug: moldeberta-smiles-encoder
Status: Ready
Title: Chemistry-Informed Molecular Encoder
Description: Given a SMILES string, returns a fixed-length molecular embedding 
  encoding physicochemical properties and substructure information. Pretrained 
  on 123 million PubChem molecules using a DeBERTaV2 backbone with 
  chemistry-informed objectives beyond masked language modeling. Fine-tunable 
  for property prediction tasks such as solubility, lipophilicity, blood-brain 
  barrier permeability, toxicity, and bioactivity, outperforming SMILES-based 
  encoders on 7 out of 9 MoleculeNet benchmarks.
